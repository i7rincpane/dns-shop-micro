server:
  port: 8081

spring:
  reactor:
    context-propagation: auto # Ключевой параметр для Gateway/Webflux
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/users/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/products/**

            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/cart/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/orders/**

            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/payments/**

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.cloud.gateway: TRACE
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n"
