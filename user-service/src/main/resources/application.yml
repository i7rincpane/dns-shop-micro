spring:
  reactor:
    context-propagation: auto
  application:
    name: user-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/user_service_db
    username: postgres
    password: postgres

  messages:
    encoding: UTF-8

  liquibase:
    url: jdbc:postgresql://localhost:5432/user_service_db
    user: postgres
    password: postgres
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org.springframework.r2dbc: DEBUG
    org.springframework.cloud.gateway: TRACE
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n"

management:
  tracing:
    sampling:
      probability: 1.0 # Логируем каждый запрос

