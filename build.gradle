plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

// 1. НАСТРОЙКИ АБСОЛЮТНО ДЛЯ ВСЕХ МОДУЛЕЙ (Включая common)
subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'ru.nvkz'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
    }

    repositories {
        mavenCentral()
    }

    checkstyle {
        toolVersion = '10.12.5'
        configFile = rootProject.file('configuration/checkstyle/checkstyle.xml')
        ignoreFailures = false
        showViolations = true
    }

    pmd {
        consoleOutput = true
        toolVersion = '7.1.0'
        ruleSetFiles = rootProject.files(rootProject.file('configuration/pmd/ruleset.xml'))
        ignoreFailures = false
    }
}

// 2. НАСТРОЙКИ ТОЛЬКО ДЛЯ МИКРОСЕРВИСОВ (Исключая библиотеку common)
configure(subprojects.findAll { it.name != 'common' }) {

    dependencies {
        // --- 1. WEB & CORE ---
        implementation libs.boot.starter.webflux
        implementation libs.boot.starter.validation
        implementation libs.boot.starter.actuator
        implementation libs.boot.starter.aop

        // --- 2. LOMBOK ---
        compileOnly "org.projectlombok:lombok:${libs.versions.lombok.get()}"
        annotationProcessor "org.projectlombok:lombok:${libs.versions.lombok.get()}"
        testCompileOnly "org.projectlombok:lombok:${libs.versions.lombok.get()}"
        testAnnotationProcessor "org.projectlombok:lombok:${libs.versions.lombok.get()}"

        // --- 3. TESTING ---
        testImplementation libs.boot.starter.test
        testImplementation libs.reactor.test
        testImplementation libs.webtestclient
        testImplementation libs.testcontainers.jupiter
        testImplementation libs.testcontainers.postgresql
        testImplementation libs.wiremock

        // --- БД и Миграции ---
        implementation libs.data.r2dbc
        implementation libs.r2dbc.postgresql
        implementation 'org.springframework.boot:spring-boot-starter-liquibase'
        implementation libs.spring.jdbc
        runtimeOnly libs.postgresql.jdbc

        // --- Mapstruct (Мапперы) ---
        implementation 'org.mapstruct:mapstruct:1.6.0.Beta1'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0.Beta1'
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

        // --- Логирование ---
        implementation 'org.slf4j:slf4j-api:2.0.17'
        implementation 'ch.qos.logback:logback-classic:1.5.32'

        // --- Resilience & Docs ---
        implementation "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j:5.0.1"
        implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.2'

        // --- Трейсинг ---
        implementation 'org.springframework.boot:spring-boot-starter-zipkin'
        implementation 'io.micrometer:context-propagation:1.1.1'

        // --- Брокер ---
        implementation 'org.springframework.boot:spring-boot-starter-kafka'
        implementation 'io.projectreactor.kafka:reactor-kafka:1.3.25'

        // Подключаем ядро ShedLock и интеграцию со Spring
        implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
        // Подключаем провайдер блокировок через JDBC (JDBC уже есть для Liquibase)
        implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.13.0'


        implementation project(':common')
    }

    jacocoTestReport {
        reports { html.required = true }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "ru/nvkz/*Application.class",
                        "ru/nvkz/config/**",
                        "ru/nvkz/domain/**",
                        "ru/nvkz/dto/**"
                ])
            }))
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy tasks.named('jacocoTestReport')
    }
}
