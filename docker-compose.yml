services:
  user-service-db:
    image: postgres:16-alpine
    container_name: user-service-db
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - dns-network
  
  product-service-db:
    image: postgres:16-alpine
    container_name: product-service-db
    environment:
      POSTGRES_DB: product_service_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    networks:
      - dns-network
  
  cart-service-db:
    image: postgres:16-alpine
    container_name: cart-service-db
    environment:
      POSTGRES_DB: cart_service_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    networks:
      - dns-network

  order-service-db:
    image: postgres:16-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: order_service_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    networks:
      - dns-network

  payment-service-db:
    image: postgres:16-alpine
    container_name: payment-service-db
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    networks:
      - dns-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://user-service-db:5432/user_service_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      
      SPRING_LIQUIBASE_URL: jdbc:postgresql://user-service-db:5432/user_service_db
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres

      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      - user-service-db
      - zipkin
    networks:
      - dns-network

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://product-service-db:5432/product_service_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      
      SPRING_LIQUIBASE_URL: jdbc:postgresql://product-service-db:5432/product_service_db
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres

      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      - product-service-db
      - zipkin
    networks:
      - dns-network 

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "8083:8083"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://cart-service-db:5432/cart_service_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      
      SPRING_LIQUIBASE_URL: jdbc:postgresql://cart-service-db:5432/cart_service_db
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres

      SERVICES_PRODUCT_SERVICE_URL: http://product-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafkaserver:9094

      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      - cart-service-db
      - kafkaserver
      - zipkin
    networks:
      - dns-network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://order-service-db:5432/order_service_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres

      SPRING_LIQUIBASE_URL: jdbc:postgresql://order-service-db:5432/order_service_db
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafkaserver:9094

      SERVICES_PRODUCT_SERVICE_URL: http://product-service:8082
      SERVICES_CART_SERVICE_URL: http://cart-service:8083

      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      - order-service-db
      - kafkaserver
      - zipkin
    networks:
      - dns-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://payment-service-db:5432/payment_service_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres

      SPRING_LIQUIBASE_URL: jdbc:postgresql://payment-service-db:5432/payment_service_db
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafkaserver:9094

      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
    depends_on:
      - payment-service-db
      - kafkaserver
      - zipkin
    networks:
      - dns-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8081:8081"
    environment:
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0

      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: user-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://user-service:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/v1/users/**

      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: product-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://product-service:8082
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/api/v1/products/**

      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: cart-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://cart-service:8083
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/api/v1/cart/**

      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: order-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://order-service:8084
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/api/v1/orders/**

      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: payment-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://payment-service:8085
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/api/v1/payments/**
    depends_on:
      - zipkin
    networks:
      - dns-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - dns-network

  kafkaserver:
    image: wurstmeister/kafka:latest
    container_name: kafkaserver
    hostname: kafkaserver
    ports:
      - "9092:9092"
    environment:
      - KAFKA_LISTENERS=INSIDE://:9094,OUTSIDE://:9092
      - KAFKA_ADVERTISED_LISTENERS=INSIDE://kafkaserver:9094,OUTSIDE://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INSIDE
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CREATE_TOPICS=order-events:3:1,payment-events:3:1
    depends_on:
      - zookeeper
    networks:
      - dns-network

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafkaserver:9094"
    depends_on:
      - kafkaserver
    networks:
      - dns-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - dns-network

networks:
  dns-network:
    driver: bridge